# The whole stack with one command:  docker compose up -d --build
#
#   Frontend  http://localhost:5173
#   API       http://localhost:8000
#   Reverb    ws://localhost:8080 (WebSockets)
#   Mailpit   http://localhost:8025
#   MySQL     127.0.0.1:3307 (for database GUI tools; user auction / secret)
#   queue + scheduler run auction start/close jobs, broadcasts and sweeps in the background
#
# Everything a fresh clone needs is set here, so no .env file has to be created
# by hand. Values below override backend/.env inside the containers.

x-backend-env: &backend-env
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: auction
  DB_USERNAME: auction
  DB_PASSWORD: secret
  REDIS_HOST: redis
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: 1025
  FRONTEND_URL: http://localhost:5173
  SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost
  SESSION_DOMAIN: localhost
  # The backend publishes to the reverb container; browsers connect to localhost:8080.
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: auction-local
  REVERB_APP_KEY: auction-local-key
  REVERB_APP_SECRET: auction-local-secret
  REVERB_HOST: reverb
  REVERB_PORT: 8080
  REVERB_SCHEME: http
  REVERB_ALLOWED_ORIGINS: localhost

x-php-service: &php-service
  build: ./docker/php
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - ./backend:/var/www/html

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auction
      MYSQL_USER: auction
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    command: ["--default-time-zone=+00:00"]
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Not published to the host: only the containers use it.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Laravel API. On start it installs dependencies if missing, creates .env from
  # .env.example on a fresh clone, migrates and seeds (idempotent).
  backend:
    <<: *php-service
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12

  # Runs queued jobs: delayed auction start/close jobs and broadcasts.
  queue:
    <<: *php-service
    environment:
      <<: *backend-env
      SKIP_BOOTSTRAP: 1
    command: ["php", "artisan", "queue:work", "--tries=5", "--sleep=1"]
    depends_on:
      backend:
        condition: service_healthy

  # Runs the scheduler: start/close safety sweeps and housekeeping.
  scheduler:
    <<: *php-service
    environment:
      <<: *backend-env
      SKIP_BOOTSTRAP: 1
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      backend:
        condition: service_healthy

  # WebSocket server (Laravel Reverb).
  reverb:
    <<: *php-service
    environment:
      <<: *backend-env
      SKIP_BOOTSTRAP: 1
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

  # React SPA (Vite dev server).
  frontend:
    image: node:24-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      # Linux node_modules live in the container, separate from the host's macOS ones.
      - frontend-node-modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_REVERB_APP_KEY: auction-local-key
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: 8080
      VITE_REVERB_SCHEME: http
    # --force rebuilds Vite's dependency cache on every start, so a stale cache
    # from an earlier install can never serve uncompiled modules or CSS.
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173 --force"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql-data:
  frontend-node-modules:
