name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (PHP 8.4, MySQL 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Tests run on MySQL, never SQLite: the bid engine relies on SELECT ... FOR UPDATE.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: auction_test
          MYSQL_USER: auction
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pcntl, bcmath, intl, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Tests (including parallel concurrency tests)
        run: php artisan test

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test -- --run

      - name: Production build
        run: npm run build
